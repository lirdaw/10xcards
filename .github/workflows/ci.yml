name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "context/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "context/**"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      # No `env:` here, deliberately. `secrets.SUPABASE_URL` / `secrets.SUPABASE_KEY` do not
      # exist in this repository, so the block that used to sit here injected two empty strings
      # and read as configured; the build tolerates their absence only because
      # `astro.config.mjs` marks every field `optional: true`. The suite's credentials are a
      # different thing entirely and are exported from the local stack further down.
      - run: npm run build

      # The isolation suite drives the real endpoints against a real Postgres — the whole
      # point is that RLS is the only lock, so a mocked database would test nothing. The
      # Supabase CLI is already a devDependency, so `npm ci` above installed it.
      - name: Start local Supabase stack
        run: npx supabase start

      # Recreate the Kong container with `KONG_UPSTREAM_KEEPALIVE_POOL_SIZE=0` — the same step
      # `npm run db:start` runs locally, invoked the same way so "identically configured" is a
      # fact rather than a claim. It removes the local `502 upstream prematurely closed
      # connection` flake at its cause: Kong 2.8.1 and PostgREST both idle out a keep-alive
      # connection at exactly 60 s, so neither reliably closes first and the loser of that race
      # answers a dead socket. No supported CLI surface exposes either timeout, hence a
      # post-`supabase start` container recreation.
      #
      # **CI does not need this, and that was measured rather than assumed** (C10X-39 research):
      # `npm test` is 10-13 s against a stack started ~3-7 s earlier with a cold Kong pool and
      # exactly one invocation per run, so no socket here can reach the 60 s it needs — 52 runs,
      # 0 unexplained reds, 0 re-runs, ~25 pre-wrapper runs all green. That research's own
      # recommendation was to add NOTHING here; the step is present by an explicit decision
      # taken AGAINST it, for configuration PARITY with the local stack — never because CI is
      # exposed. Read that as: this is the first thing to drop if it ever goes red on a Supabase
      # CLI upgrade.
      #
      # `continue-on-error: true` is what keeps that decision honest, and it is a deliberate
      # asymmetry with the drift gate below. The script is fail-closed by contract, because
      # locally its value is refusing to report success on what it did not verify — but this
      # `ci` job is what `drift` and `deploy` both declare in `needs:`, so without the flag an
      # unsupported `docker` operation breaking on a CLI upgrade would stop a release over a
      # flake CI is structurally immune to. Fail-closed is right for evidence ABOUT PRODUCTION;
      # it is wrong for a step whose own justification is cosmetic. So a red here is ADVISORY —
      # a note about the local-parity experiment, never evidence about the code. The flip side:
      # a green job no longer implies this step passed, so read the step's own conclusion. The
      # script restores the stock container on any failure past its `docker rm -f`, which is
      # what stops a tolerated failure leaving the steps below talking to a stack with no proxy.
      - name: Disable Kong upstream keep-alive pooling (local parity, advisory)
        continue-on-error: true
        run: npm run db:kong

      # Drift class 8: `database.types.ts` is GENERATED from the schema, so a migration that
      # lands without a regeneration leaves the app type-checking against a database that no
      # longer matches. Regenerate and diff — a non-empty diff means the committed file is
      # stale. This belongs here rather than in its own job precisely because the stack it
      # needs is already paid for by the suite below; a second `supabase start` would add
      # ~1m46s to every run. `.gitattributes` is `* text=auto eol=lf`, so a Linux runner
      # cannot produce a diff from line endings alone: red means a real divergence.
      - name: Check generated types against the schema
        run: |
          npm run db:types
          git diff --exit-code src/db/database.types.ts

      # The suite runs against the LOCAL stack, never the repository secrets: it signs up
      # throwaway accounts and asserts one cannot reach the other's rows. Point it at the
      # cloud project and it would create junk users in production.
      - name: Export local stack credentials
        run: |
          npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' > status.env
          . ./status.env
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          rm status.env

      - run: npm test

  # Does the cloud database carry every migration this commit does? A history oracle, not a
  # schema diff — the drift this project actually lived through was a `migration repair`
  # desync that left the schema byte-identical (lessons.md, "Operacje migracji Supabase"),
  # which a DDL diff cannot see. It gets its own job so a failure reads as "prod is not
  # migrated" rather than "tests failed", and so cloud credentials never share a job with the
  # suite that the comments above insist must stay on the local stack.
  #
  # Same `if` as `deploy`, which is what makes pull-request behaviour correct for free: on a
  # PR this job is skipped, and a job whose `needs` dependency was skipped is skipped too.
  # `/ship` runs `db push` AFTER `gh pr create`, so at PR time prod is legitimately behind and
  # a blocking PR gate would be red by design.
  drift:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # No `npm ci` and no npm cache, deliberately: the script has zero runtime dependencies
      # (node:fs + global fetch), which is what keeps this job at seconds rather than minutes
      # on the path between merge and deploy. Keep it that way.
      - name: Check migration history against the cloud
        run: node --experimental-strip-types scripts/check-schema-drift.ts

  deploy:
    # Both, and with no `always()` / `!cancelled()` escape hatch — one would let the deploy
    # run after a failed gate, which is the single thing this gate exists to prevent.
    needs: [ci, drift]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.90.0"
          command: deploy
